{% set name = "docs-versions-menu" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/docs_versions_menu-{{ version }}.tar.gz
  sha256: 07f6110275ec45238e4b1fa8e1eeda32306067914e94f9beb5694df124bce78b

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - docs-versions-menu = docs_versions_menu.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools

  run:
    - python >={{ python_min }}
    - jinja2
    - click >=6.7
    - packaging
    - pyparsing >=2.0.2
    - sphinx

test:
  imports:
    - docs_versions_menu
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - docs-versions-menu --help
    - pip check

about:
  home: https://github.com/goerz/docs_versions_menu
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A versions-menu for Sphinx-based documentation.
  doc_url: https://goerz.github.io/docs_versions_menu
  dev_url: https://github.com/goerz/docs_versions_menu

extra:
  recipe-maintainers:
    - hhslepicka
    - goerz
